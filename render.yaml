services:
  - type: web
    name: aml-dashboard
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 layers.human_interaction.web_application:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_KEY
        sync: false  # Must be set manually in Render dashboard or via secrets
      - key: SUPABASE_URL
        value: https://pcpurhkthawyipfibehn.supabase.co
      - key: FLASK_ENV
        value: production
    healthCheckPath: /

