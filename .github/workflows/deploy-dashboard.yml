name: Deploy AML Dashboard

on:
  push:
    branches:
      - main
      - feature-ETL-Dashboard
  workflow_dispatch:  # Allow manual trigger
    inputs:
      num_accounts:
        description: 'Number of accounts to generate'
        required: false
        default: '500'

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate raw data and run ETL pipeline
      env:
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        echo "Running complete pipeline with dashboard generation..."
        python run_complete_pipeline.py ${{ secrets.SUPABASE_KEY }} ${{ secrets.OPENAI_API_KEY }} ${{ github.event.inputs.num_accounts || '500' }}


    - name: Archive dashboard artifacts (Free - 30 days retention)
      uses: actions/upload-artifact@v4
      with:
        name: aml-dashboards-${{ github.run_number }}
        path: output/
        retention-days: 30


    - name: Deploy to Render (Optional)
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      run: |
        if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
          echo "✓ Triggering Render deployment..."
          curl -X POST "https://api.render.com/deploy/srv-${RENDER_SERVICE_ID}?key=${RENDER_API_KEY}"
        else
          echo "ℹ️  Render deployment skipped (API key or Service ID not configured)"
          echo "   To enable Render deployment, add RENDER_API_KEY and RENDER_SERVICE_ID to repository secrets"
        fi

    - name: Summary
      env:
        RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
      run: |
        echo "## 🎉 Pipeline Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Download Your Dashboards (100% Free)" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to the **Artifacts** section below" >> $GITHUB_STEP_SUMMARY
        echo "2. Click **aml-dashboards-${{ github.run_number }}** to download ZIP" >> $GITHUB_STEP_SUMMARY
        echo "3. Extract and open HTML files in your browser" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Available Dashboards:**" >> $GITHUB_STEP_SUMMARY
        echo "- \`dashboard_compliance_officer.html\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`dashboard_risk_analyst.html\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`dashboard_regulatory_officer.html\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -n "$RENDER_APP_URL" ]; then
          echo "### 🌐 Web Application (Optional)" >> $GITHUB_STEP_SUMMARY
          echo "- **Render App**: https://${RENDER_APP_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Default Login Credentials:**" >> $GITHUB_STEP_SUMMARY
          echo "- Compliance Officer: \`compliance@aml.com\` / \`Compliance@123\`" >> $GITHUB_STEP_SUMMARY
          echo "- Risk Analyst: \`risk@aml.com\` / \`Risk@123\`" >> $GITHUB_STEP_SUMMARY
          echo "- Regulatory Officer: \`regulatory@aml.com\` / \`Regulatory@123\`" >> $GITHUB_STEP_SUMMARY
          echo "- Administrator: \`admin@aml.com\` / \`Admin@123\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "### 💡 Optional: Deploy Web App" >> $GITHUB_STEP_SUMMARY
          echo "For a live web application with authentication, deploy to Render.com (free tier)" >> $GITHUB_STEP_SUMMARY
          echo "See DEPLOYMENT.md for instructions" >> $GITHUB_STEP_SUMMARY
        fi

